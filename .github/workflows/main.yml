name: Funny Minseol Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 파일 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필요한 프로그램 설치
        run: |
          pip install edge-tts pillow google-api-python-client google-auth
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 웃긴민설 영상 만들기
        run: python bot.py

      - name: 만든 영상 저장하기
        uses: actions/upload-artifact@v4
        with:
          name: funny-minseol-video
          path: output/funny_minseol.mp4

      - name: 유튜브에 자동 업로드
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
        run: python upload_youtube.py
